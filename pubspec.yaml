name: ilajak
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Routing
  go_router: ^17.3.0

  # Networking
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.3.0

  # Dependency Injection
  get_it: ^9.2.1

  # Functional Programming
  fpdart: ^1.2.0

  # Localization
  easy_localization: ^3.0.8

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # UI / Responsive
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.2.0
  skeletonizer: ^2.1.3
  hugeicons: ^1.1.7

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3

  # Utilities
  logger: ^2.7.0
  intl: ^0.20.3
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
